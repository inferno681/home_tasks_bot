[project]
name = "home-tasks-bot"
version = "0.1.0"
description = "Telegram-бот для трекинга домашних дел"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15.0",
    "apscheduler>=3.10.4",
    "beanie>=2.1.0",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "flake8>=7.3.0",
    "wemake-python-styleguide>=1.0.0",
    "isort>=6.0.0",
    "mypy>=1.15.0",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.pytest.ini_options]
pythonpath = ["."]
