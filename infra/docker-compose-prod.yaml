services:

  home_tasks_bot:
    container_name: home_tasks_bot
    # DOCKERHUB_USERNAME/CONTAINER_NAME подставляются из .env.deploy, который
    # CI генерирует на сервере из GitHub-секретов перед `docker compose`
    # (.github/workflows/main.yml, job deploy) — не из основного .env.
    image: ${DOCKERHUB_USERNAME}/${CONTAINER_NAME}:latest
    init: true
    restart: always
    volumes:
      - ./config.yaml:/app/config/config.yaml
    env_file:
      - .env
    # порт нужен, только если в config.yaml включён service.webhook
    ports:
      - "8000:8000"
