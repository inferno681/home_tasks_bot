[flake8]
format = wemake

max-line-length = 79
max-complexity = 6

nested-classes-whitelist = Settings

exclude =
  .git
  .venv
  __init__.py
  .github

# Отключено намеренно, а не по умолчанию:
# D1xx/DARxxx — докстринги не по каждому паблик-объекту, стиль проекта — без
#   комментариев/докстрингов там, где код самодокументируется (см. CLAUDE.md-конвенцию сессии).
# W503 — конфликтует с чёрным/PEP8 по переносу перед бинарным оператором.
# WPS476/WPS501/WPS243 — `await` в цикле, `finally` без `except` и длина
#   `finally` — намеренные паттерны в этом проекте (последовательная рассылка
#   апдейтов, гарантированная очистка ресурсов + лог остановки при завершении).
# WPS111/WPS217/WPS210/WPS432/WPS237/WPS229 — пороги wemake (короткие имена в
#   стандартных идиомах вроде `except ... as e`/`enumerate`, число await/локалов
#   в хендлерах aiogram, литералы дат/границ) — не признак реальной проблемы
#   в коде такого масштаба.
# WPS347 — ложно цепляется за обычные однословные импорты (`F`, `to_local`, `to_utc`).
# WPS110 — считает `data`/`handler` "плохими" именами, а это как раз канонические
#   имена параметров в сигнатуре aiogram BaseMiddleware.__call__ и стандартное
#   имя для `await state.get_data()`.
# WPS407 — мутабельные модульные константы-словари (например, таблица
#   сопоставления коротких кодов дедлайна с timedelta) — не мутируются в рантайме,
#   оборачивать в MappingProxyType ради линтера не оправдано.
ignore =
  D100, D101, D102, D103, D104, D105, D106, D107,
  DAR101, DAR201, DAR301, DAR401,
  W503,
  WPS110, WPS111, WPS217, WPS210, WPS432, WPS237, WPS229,
  WPS347, WPS407, WPS476, WPS501, WPS243

per-file-ignores =
  bot/handlers/list_tasks.py: WPS201, WPS202, C901
  bot/handlers/new_task.py: WPS201, WPS202

[isort]
line_length = 79
multi_line_output = 3
include_trailing_comma = true

[mypy]
python_version = 3.12
ignore_missing_imports = True

# aiogram типизирует Message/CallbackQuery предельно широко (Optional-поля,
# Message | InaccessibleMessage | None), т.к. один тип покрывает все виды
# апдейтов; конкретный хендлер уже отфильтрован по F.text/F.photo/Command,
# так что на практике поле есть — mypy этого не видит. Аналогично beanie
# строит запросы через перегрузку операторов на уровне класса, из-за чего
# `Task.due_at <= now`/`Task.find(*conditions)` мypy читает как несовместимые
# типы. Ослабляю точечно для этого слоя, а не переписываю рабочий код.
[mypy-bot.handlers.*]
disable_error_code = union-attr, arg-type, index, call-overload

[mypy-bot.scheduler]
disable_error_code = operator
