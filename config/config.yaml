service:
  webhook: false
  web_server_host: "0.0.0.0"
  web_server_port: 8000
  webhook_path: /webhook
  base_webhook_url: ""

mongodb:
  db: home_tasks

scheduler:
  interval_seconds: 60
  quiet_hours_enabled: true
  quiet_hours_start: 22
  quiet_hours_end: 8

# storage: memory (по умолчанию, ничего не нужно) | redis | mongo (переиспользует
# соединение к Atlas из bot/db.py, отдельная коллекция fsm.mongo_collection)
fsm:
  storage: "memory"
  mongo_collection: "fsm_states"

redis:
  host: "localhost"
  port: 6379
  db: 0

logger:
  level: "INFO"
  format: "[%(asctime)s.%(msecs)03d] %(name)-25s %(levelname)-7s - %(message)s"
